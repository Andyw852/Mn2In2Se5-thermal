# step6_kappa —— BTE 晶格热导率（共享 fit-fc-thermal 引擎：phono3py 或 ShengBTE 三声子 BTE）。
# 参数面 = fit-fc-thermal step2_kappa 的参数面（MESH/MESH_CONV*/T_*/ISOTOPE/NAC/BTE_METHOD/SOLVER）。
[params]
MESH = auto      # auto=按倒格矢自动定网格并做 q 网格收敛（推荐）；"n n n" 固定不做收敛
T_MIN = 100
T_MAX = 800
T_STEP = 100
ISOTOPE    = true      # 同位素散射（自然丰度）
# BTE 解法：默认走 ShengBTE 迭代解（用户 2026-10-30 定：热导率一律用 ShengBTE 完整解）
#   conv = ShengBTE 迭代解（CONTROL convergence=.TRUE.；同时也写 RTA 结果，迭代不收敛时才回退 RTA）
#   rta  = 弛豫时间近似（phono3py --br，ShengBTE convergence=.FALSE.）——仅明确要 RTA 时改回
#   lbte = phono3py 直接解（--lbte，内存 O(N_mode^2)）
#   写成另一个求解器的名字时按当前 SOLVER 换算并在 gen 输出里打印
BTE_METHOD = conv
# BTE 求解器：shengbte（默认）| phono3py。[0102] 起两者同一套流程：MESH=auto 时在参考截断上做
#   q 网格收敛（MESH_CONV*），每档截断在收敛网格上各跑一次，按三判据选截断
#   2026-10-30 用户定：kl 流程默认用 ShengBTE + conv（迭代解）+ ISOTOPE=true。
SOLVER     = shengbte
# ---- shengbte 专属（phono3py 忽略）----
# EXE / TOTAL_CORES / CORES_PER_NUMA 由 setting/<集群>.yaml 的 shengbte_* 键注入（最低优先级，
# 切超算自动跟着走）；项目 step.conf 仍可覆盖。下面只是没有任何集群注入时的兜底值。
SHENGBTE_EXE        = /home/zyzhuqgroup/wangchao217/software/taskflow/shengbte-ols699-cpu/ShengBTE   # 2026-11-07 S6 改 hanhai25：该 build 链接 /opt/openmpi/5.0.9-ucx + venv mace_cpu 的 libsymspg，依赖全部可解析
SHENGBTE_SCALEBROAD = 1.0        # 高斯展宽（ShengBTE 默认 1.0；0.1 会漏过程）
# MPI 布局：一个 rank 占一个 NUMA 节点；NTASKS=auto 时 = TOTAL_CORES / CORES_PER_NUMA，
#   rank=1 等于串行会被 gen 拒绝（jzzn：192 核 = 8 NUMA x 24 核）
SHENGBTE_TOTAL_CORES = 256    # hanhai25 计算节点：CPUTot=256, Sockets=2, CoresPerSocket=128 → 2 rank x 128 线程（一 rank 一 NUMA）
SHENGBTE_CORES_PER_NUMA = 128
SHENGBTE_NTASKS         = auto
NAC = off      # auto=有 BORN 且非 2D 才开（2D 不加 3D-NAC）；on/off 强制
SUPERCELL_SYMMETRY = strict  # 超胞须保原胞全部点群操作：strict 停 | warn 告警 | off
# 逐档截断 κ 扫描 + 三判据选截断（需要 S5 用 CUT3_SCAN=auto 拟出 cutoff_scan/cut3_<tag>/）
CUT3_CV_1SE_MULT   = 1.0       # 判据①：1-SE 规则的 SE 倍数
CUT3_PICK          = largest   # 在 κ 连续稳定区间内取：largest=最大（2026-10-15 起默认）| smallest=最小（区间后的跳变都不采用）
CUT3_MIN_RATIO     = 3.0      # 数据量门槛：方程数/参数数 < 它的截断档不参与选择，图上空心点+灰底标出（补帧可纳入）
MESH_CONV_TOL_PCT = 5.0
CUT3_KAPPA_SCAN = auto
