# step6_kappa -- BTE lattice thermal conductivity (shared fit-fc-thermal engine: phono3py or ShengBTE three-phonon BTE).
# parameter surface = that of fit-fc-thermal step2_kappa (MESH/MESH_CONV*/T_*/ISOTOPE/NAC/BTE_METHOD/SOLVER).
[params]
MESH = auto      # auto=derive the mesh automatically from the reciprocal lattice and run a q-mesh convergence (recommended); "n n n" fixes it with no convergence
T_MIN = 100
T_MAX = 800
T_STEP = 100
ISOTOPE    = true      # isotope scattering (natural abundance)
# BTE solution: defaults to the ShengBTE iterative solution (user decision 2026-10-30: always use the full ShengBTE solution for thermal conductivity)
#   conv = ShengBTE iterative solution (CONTROL convergence=.TRUE.; the RTA result is also written, and RTA is used only if the iteration does not converge)
#   rta  = relaxation-time approximation (phono3py --br, ShengBTE convergence=.FALSE.) -- go back to it only when RTA is explicitly wanted
#   lbte = phono3py direct solution (--lbte, memory O(N_mode^2))
#   if the other solver's name is written here it is converted to the current SOLVER and printed in the gen output
BTE_METHOD = conv
# BTE solver: shengbte (default) | phono3py. Since [0102] both use the same flow: with MESH=auto a q-mesh convergence is run at the reference cutoff
#   (MESH_CONV*); each cutoff is then run once on the converged mesh, and the cutoff is chosen by the three criteria
#   user decision 2026-10-30: the kl workflow defaults to ShengBTE + conv (iterative solution) + ISOTOPE=true.
SOLVER     = shengbte
# ---- shengbte-specific (ignored by phono3py) ----
# EXE / TOTAL_CORES / CORES_PER_NUMA are injected from the shengbte_* keys of setting/<cluster>.yaml (lowest priority,
# they follow automatically when switching HPC); a project step.conf can still override them. The values below are only the fallback when no cluster injects anything.
SHENGBTE_EXE        = /home/zyzhuqgroup/wangchao217/software/taskflow/shengbte-ols699-cpu/ShengBTE   # 2026-11-07, S6 moved to hanhai25: this build links /opt/openmpi/5.0.9-ucx + libsymspg from the mace_cpu venv, and all dependencies resolve
SHENGBTE_SCALEBROAD = 1.0        # Gaussian broadening (ShengBTE default 1.0; 0.1 misses processes)
# MPI layout: one rank per NUMA node; with NTASKS=auto this is TOTAL_CORES / CORES_PER_NUMA,
#   rank=1 means serial and is rejected by gen (jzzn: 192 cores = 8 NUMA x 24 cores)
SHENGBTE_TOTAL_CORES = 256    # hanhai25 compute node: CPUTot=256, Sockets=2, CoresPerSocket=128 -> 2 ranks x 128 threads (one rank per NUMA)
SHENGBTE_CORES_PER_NUMA = 128
SHENGBTE_NTASKS         = auto
NAC = off      # auto=on only when BORN exists and the system is not 2D (no 3D-NAC for 2D); on/off force it
SUPERCELL_SYMMETRY = strict  # the supercell must preserve all point-group operations of the primitive cell: strict stops | warn alerts | off
# per-cutoff κ scan + cutoff selection by the three criteria (requires S5 to produce cutoff_scan/cut3_<tag>/ with CUT3_SCAN=auto)
CUT3_CV_1SE_MULT   = 1.0       # criterion (1): the SE multiplier of the 1-SE rule
CUT3_PICK          = largest   # picked within the contiguous κ plateau: largest=the largest (default since 2026-10-15) | smallest=the smallest (the jumps after the interval are not adopted)
CUT3_MIN_RATIO     = 3.0      # data-volume gate: cutoff steps with number of equations / number of parameters below it are excluded from the choice and marked with hollow points + grey shading on the plot (they can be included by adding frames)
MESH_CONV_TOL_PCT = 5.0
CUT3_KAPPA_SCAN = auto
